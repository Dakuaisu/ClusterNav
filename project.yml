name: ClusterNav
options:
  bundleIdPrefix: com.n250ride
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
packages:
  RideCore:
    path: Packages/RideCore
# Google Navigation SDK (excluded while Apple MapKit is the provider). To re-enable:
# add these packages and the two app dependencies below, set N250_NAV_PROVIDER = google.
#  GoogleNavigation:
#    url: https://github.com/googlemaps/ios-navigation-sdk
#    exactVersion: 11.3.0
#  GoogleMaps:
#    url: https://github.com/googlemaps/ios-maps-sdk
#    exactVersion: 11.3.0
targets:
  ClusterNav:
    type: application
    platform: iOS
    sources: [ClusterNav, Shared]
    dependencies:
      - package: RideCore
      - target: ClusterNavWidgets
      - target: ClusterNavShare
#      - package: GoogleNavigation
#        product: GoogleNavigation
#      - package: GoogleMaps
#        product: GoogleMaps
    info:
      path: ClusterNav/Info.plist
      properties:
        CFBundleDisplayName: ClusterNav
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.n250ride.open
            CFBundleURLSchemes: [n250ride]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: ClusterNav connects to your motorcycle's instrument cluster to show turn arrows, distance and arrival time.
        NSLocationWhenInUseUsageDescription: ClusterNav uses your location to calculate the route and give turn-by-turn guidance.
        NSLocationAlwaysAndWhenInUseUsageDescription: ClusterNav keeps guiding and updating your bike's dashboard while the phone is locked during navigation.
        UIBackgroundModes: [bluetooth-central, location, audio]
        N250NavigationProvider: $(N250_NAV_PROVIDER)
        N250GoogleAPIKey: $(N250_GOOGLE_API_KEY)
        N250LiveNavigationAuthorized: $(N250_LIVE_NAVIGATION_AUTHORIZED)
        N250StatusProfile: $(N250_STATUS_PROFILE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(N250_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(N250_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
  ClusterNavWidgets:
    type: app-extension
    platform: iOS
    sources: [ClusterNavWidgets, Shared/RideActivityAttributes.swift]
    info:
      path: ClusterNavWidgets/Info.plist
      properties:
        CFBundleDisplayName: ClusterNav
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(N250_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: $(N250_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
  ClusterNavShare:
    type: app-extension
    platform: iOS
    sources: [ClusterNavShare, Shared/ShareInbox.swift]
    dependencies:
      - package: RideCore
    info:
      path: ClusterNavShare/Info.plist
      properties:
        CFBundleDisplayName: ClusterNav
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(N250_BUNDLE_ID).share
        DEVELOPMENT_TEAM: $(N250_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
  ClusterNavTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClusterNavTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ClusterNav
  ClusterNavUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClusterNavUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ClusterNav
schemes:
  ClusterNav:
    build:
      targets:
        ClusterNav: all
    test:
      targets: [ClusterNavTests, ClusterNavUITests]
